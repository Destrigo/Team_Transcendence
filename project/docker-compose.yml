# PaperTrade stack.
# Public entry: https://localhost  (Caddy terminates TLS)
# Backend/frontend stay HTTP on the internal Docker network only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-papertrade}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-papertrade_secret}
      POSTGRES_DB: ${DB_NAME:-papertrade}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-papertrade}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-papertrade}:${DB_PASSWORD:-papertrade_secret}@db:5432/${DB_NAME:-papertrade}?schema=public
      COINGECKO_API_URL: ${COINGECKO_API_URL:-https://api.coingecko.com/api/v3}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FINNHUB_API_URL: ${FINNHUB_API_URL:-https://finnhub.io/api/v1}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      PORT: 4000
    # Not published on host — reach API via https://localhost/api
    expose:
      - "4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - /app/node_modules
      - avatar_uploads:/app/uploads
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        (npx prisma db seed || true) &&
        npm run start:dev
      "
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    # Not published on host — reach UI via https://localhost
    expose:
      - "3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    environment:
      VITE_API_URL: ${PUBLIC_URL:-https://localhost}
      VITE_WS_URL: ${PUBLIC_URL:-https://localhost}
    restart: unless-stopped

  proxy:
    image: caddy:2.8-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  avatar_uploads:
  caddy_data:
  caddy_config:
