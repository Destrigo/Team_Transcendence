<style>
#arch { min-height: 200px; }
#arch svg { max-width: 100%; height: auto; }
</style>
<div id="arch"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  flowchart: { curve: 'basis', padding: 16, nodeSpacing: 20, rankSpacing: 50 },
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('arch-svg', `flowchart LR
    subgraph External["External services (all optional / feature-flagged)"]
        CoinGecko["CoinGecko API\n(crypto, no key needed)"]
        Finnhub["Finnhub API\n(stocks, needs API key)"]
        OAuthProv["Google / GitHub / 42\n(OAuth, needs credentials)"]
        SMTP["SMTP\n(GDPR confirmation emails)"]
    end

    subgraph Backend["NestJS backend (src/)"]
        direction TB
        Auth["auth/\nJWT + OAuth + 2FA\n(one module)"]
        Users["users/\nprofile, avatar, deposit"]
        AssetsMod["assets/\nAssetsService +\nMarketDataService"]
        Orders["orders/\n(the only HTTP surface\nfor placing orders)"]
        Trading["trading/\nTradingService +\nprice-checker.scheduler\n(fills limit orders)"]
        Portfolio["portfolio/"]
        Analytics["analytics/\n+ snapshot.scheduler"]
        Social["social/\nfriends + messages +\nnotifications + leaderboard"]
        Gdpr["gdpr/"]
        PriceGW["websocket/\nPriceFeedGateway\n(/prices)"]
        SocialGW["social/social.gateway.ts\nSocialGateway (/social)"]
        Mail["common/mail/\nMailService"]
    end

    subgraph Data["PostgreSQL"]
        DB[("9 tables\nvia Prisma ORM")]
    end

    subgraph Clients["Connected browsers"]
        Browser1["Browser 1"]
        Browser2["Browser 2"]
        BrowserN["Browser N"]
    end

    CoinGecko -->|every 30s| AssetsMod
    Finnhub -.->|every 60s, no-op if\nAPI key unset| AssetsMod
    OAuthProv -.->|only registered if\ncredentials configured| Auth

    Auth --> DB
    Users --> DB
    AssetsMod --> DB
    Orders --> Trading
    Trading --> DB
    Portfolio --> DB
    Analytics --> DB
    Social --> DB
    Gdpr --> DB
    Gdpr -.->|only sent if\nSMTP configured| Mail
    Mail -.-> SMTP

    AssetsMod -->|price changed| PriceGW
    Trading -->|order filled/cancelled| Social
    Social -->|new message,\nfriend request| SocialGW

    PriceGW -->|price:update, price:batch| Browser1
    SocialGW -->|message:new,\npresence:update| Browser2
    SocialGW -->|notifications| BrowserN

    Browser1 -->|REST + WS handshake\nJWT cookie| Auth
    Browser1 -->|POST /api/orders| Orders

    style CoinGecko fill:${dark?'#085041':'#E1F5EE'},stroke:${dark?'#5DCAA5':'#0F6E56'}
    style Finnhub fill:${dark?'#085041':'#E1F5EE'},stroke:${dark?'#5DCAA5':'#0F6E56'}
    style OAuthProv fill:${dark?'#085041':'#E1F5EE'},stroke:${dark?'#5DCAA5':'#0F6E56'}
    style SMTP fill:${dark?'#085041':'#E1F5EE'},stroke:${dark?'#5DCAA5':'#0F6E56'}
    style Auth fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Users fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style AssetsMod fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Orders fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Trading fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Portfolio fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Analytics fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Social fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Gdpr fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style Mail fill:${dark?'#3C3489':'#EEEDFE'},stroke:${dark?'#AFA9EC':'#534AB7'}
    style PriceGW fill:${dark?'#633806':'#FAEEDA'},stroke:${dark?'#EF9F27':'#854F0B'}
    style SocialGW fill:${dark?'#633806':'#FAEEDA'},stroke:${dark?'#EF9F27':'#854F0B'}
    style DB fill:${dark?'#0C447C':'#E6F1FB'},stroke:${dark?'#85B7EB':'#185FA5'}
    style Browser1 fill:${dark?'#444441':'#F1EFE8'},stroke:${dark?'#B4B2A9':'#5F5E5A'}
    style Browser2 fill:${dark?'#444441':'#F1EFE8'},stroke:${dark?'#B4B2A9':'#5F5E5A'}
    style BrowserN fill:${dark?'#444441':'#F1EFE8'},stroke:${dark?'#B4B2A9':'#5F5E5A'}
`);
document.getElementById('arch').innerHTML = svg;
document.querySelectorAll('#arch .node path').forEach(p => {
  const d = p.getAttribute('d');
  if (!d) return;
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = nums.filter((_,i) => i%2===0), ys = nums.filter((_,i) => i%2===1);
  const x=Math.min(...xs), y=Math.min(...ys), w=Math.max(...xs)-x, h=Math.max(...ys)-y;
  if (w < 10 || h < 10) return;
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x',x); rect.setAttribute('y',y);
  rect.setAttribute('width',w); rect.setAttribute('height',h);
  rect.setAttribute('rx','8');
  for (const a of ['fill','stroke','stroke-width','class','style'])
    if (p.hasAttribute(a)) rect.setAttribute(a, p.getAttribute(a));
  p.replaceWith(rect);
});
</script>
